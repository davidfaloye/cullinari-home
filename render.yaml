services:
  - type: web
    name: cullinari-home
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://cullinari.com
      # gridfs = uploads stored in MongoDB (free plan). Change to "disk" only after attaching
      # a persistent disk (paid plan) and setting UPLOAD_DIR to its mount path.
      - key: STORAGE_DRIVER
        value: gridfs
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PLAN_STARTER
        sync: false
      - key: PAYSTACK_PLAN_GROWTH
        sync: false
      - key: PAYSTACK_PLAN_PRO
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_REPLY_TO
        sync: false
      - key: TEAM_EMAIL
        sync: false

# To use a persistent disk later (requires a paid plan):
#   1. Change `plan: free` to `plan: starter`.
#   2. Add under the service:
#        disk:
#          name: uploads
#          mountPath: /var/data
#          sizeGB: 1
#   3. Set STORAGE_DRIVER=disk and add UPLOAD_DIR=/var/data/uploads.